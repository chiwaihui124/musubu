<svg viewBox="0 0 450 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Mizuhiki-style knot forming a Venn/heart shape -->
  <!-- Left loop -->
<path d="M 70 75 
        C 70 35, 30 35, 30 75
        C 30 105, 60 115, 75 95" 
     fill="none" 
     stroke="#c53d43" 
     stroke-width="8"
     stroke-linecap="round"/>
  <!-- Right loop -->
<path d="M 80 75 
        C 80 35, 120 35, 120 75
        C 120 105, 90 115, 75 95" 
     fill="none" 
     stroke="#b83340" 
     stroke-width="8"
     stroke-linecap="round"/>
  <!-- Center crossing strands - the "binding" -->
<path d="M 55 60 C 65 75, 85 75, 95 60" 
     fill="none" 
     stroke="#a02c38" 
     stroke-width="6"
     stroke-linecap="round"/>
<path d="M 55 85 C 65 70, 85 70, 95 85" 
     fill="none" 
     stroke="#c53d43" 
     stroke-width="6"
     stroke-linecap="round"/>
  <!-- Three dots in the center intersection - the coordination match -->
  <circle cx="67" cy="72" r="5" fill="#1e4d78"/>
  <circle cx="83" cy="72" r="5" fill="#1e4d78"/>
  <circle cx="75" cy="58" r="5" fill="#1e4d78"/>
  <!-- Wordmark -->
<text x="155" y="70" 
     font-family="Georgia, 'Hiragino Mincho Pro', serif" 
     font-size="48" 
     font-weight="400" 
     fill="#1e4d78" 
     letter-spacing="2">Musubu</text>
  <!-- Kanji -->
<text x="155" y="105" 
     font-family="Georgia, 'Hiragino Mincho Pro', serif" 
     font-size="22" 
     fill="#8b7355" 
     letter-spacing="8">結ぶ</text>
</svg>