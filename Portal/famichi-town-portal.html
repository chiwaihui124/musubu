<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Famichi Town Portal - Bungotakada</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Noto Sans JP', sans-serif; }
    .font-display { font-family: 'Playfair Display', serif; }
    .gradient-warm { background: linear-gradient(135deg, #fef3e2 0%, #fce7d6 50%, #f5d5c8 100%); }
    .gradient-sunset { background: linear-gradient(180deg, #ff9a56 0%, #ff6b6b 50%, #c44569 100%); }
    .gradient-life { background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%); }
    .text-warm { color: #8b5a3c; }
    .bg-warm { background-color: #fef7f0; }
    .bg-cream { background-color: #fffbf5; }
    .border-warm { border-color: #e8d5c4; }
    .shadow-warm { box-shadow: 0 4px 20px rgba(139, 90, 60, 0.1); }
    .pulse-gentle { animation: pulse-gentle 3s ease-in-out infinite; }
    @keyframes pulse-gentle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    .slide-in { animation: slideIn 0.6s ease-out; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .progress-fill {
      background: linear-gradient(90deg, #84fab0 0%, #4ade80 50%, #22c55e 100%);
      transition: width 1s ease-out;
    }
    .card-hover:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(139, 90, 60, 0.15); }
    .card-hover { transition: all 0.3s ease; }
  </style>
</head>
<body class="bg-cream">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Icons as simple SVG components
    const Icons = {
      MapPin: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>,
      Users: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>,
      Calendar: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>,
      Heart: () => <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>,
      Briefcase: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>,
      Home: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>,
      Clock: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
      TrendingUp: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" /></svg>,
      Check: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" /></svg>,
      Star: () => <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>,
      Quote: () => <svg className="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M6 17h3l2-4V7H5v6h3zm8 0h3l2-4V7h-6v6h3z"/></svg>,
      ArrowRight: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 7l5 5m0 0l-5 5m5-5H6" /></svg>,
      Building: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" /></svg>,
      Sparkles: () => <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3l1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5L12 3zm6 12l1 3 3 1-3 1-1 3-1-3-3-1 3-1 1-3zM5 15l.75 2.25L8 18l-2.25.75L5 21l-.75-2.25L2 18l2.25-.75L5 15z"/></svg>,
    };

    // ==========================================
    // SECTION 1: HERO / IDENTITY
    // ==========================================
    const HeroSection = () => {
      return (
        <section className="relative min-h-screen">
          {/* Background Image Placeholder */}
          <div className="absolute inset-0 bg-gradient-to-b from-amber-100 via-orange-50 to-rose-50">
            {/* Decorative elements to simulate Showa-era aesthetic */}
            <div className="absolute inset-0 opacity-20">
              <div className="absolute top-20 left-10 w-64 h-64 rounded-full bg-orange-200 blur-3xl"></div>
              <div className="absolute bottom-40 right-20 w-96 h-96 rounded-full bg-rose-200 blur-3xl"></div>
            </div>
          </div>

          {/* Navigation */}
          <nav className="relative z-10 px-6 py-4">
            <div className="max-w-6xl mx-auto flex justify-between items-center">
              <div className="flex items-center gap-2">
                <span className="text-2xl font-bold text-warm">Famichi</span>
                <span className="text-sm text-amber-700 bg-amber-100 px-2 py-0.5 rounded-full">Town Portal</span>
              </div>
              <div className="flex gap-6 text-warm text-sm font-medium">
                <a href="#calendar" className="hover:text-amber-600 transition">Events</a>
                <a href="#tracker" className="hover:text-amber-600 transition">Progress</a>
                <a href="#opportunities" className="hover:text-amber-600 transition">Opportunities</a>
                <button className="bg-amber-600 text-white px-4 py-2 rounded-full hover:bg-amber-700 transition">
                  Express Interest
                </button>
              </div>
            </div>
          </nav>

          {/* Hero Content */}
          <div className="relative z-10 max-w-6xl mx-auto px-6 pt-16 pb-24">
            <div className="grid lg:grid-cols-2 gap-12 items-center">
              {/* Left: Town Identity */}
              <div className="slide-in">
                {/* Location Badge */}
                <div className="flex items-center gap-2 text-amber-700 mb-4">
                  <Icons.MapPin />
                  <span className="text-sm font-medium">Oita Prefecture, Kyushu • 45 min to Oita City</span>
                </div>

                {/* Town Name */}
                <h1 className="font-display text-6xl lg:text-7xl text-warm mb-4 leading-tight">
                  Bungotakada
                </h1>
                <p className="text-xl text-amber-800 mb-2 font-medium">豊後高田市</p>

                {/* Tagline */}
                <p className="text-2xl text-amber-700 mb-6 font-light leading-relaxed">
                  Where the warmth of the Showa Era meets tomorrow's families
                </p>

                {/* Unique Identity */}
                <div className="bg-white/70 backdrop-blur-sm rounded-2xl p-6 mb-8 border border-amber-200 shadow-warm">
                  <div className="flex items-start gap-4">
                    <div className="w-12 h-12 rounded-full bg-amber-100 flex items-center justify-center flex-shrink-0">
                      <Icons.Sparkles />
                    </div>
                    <div>
                      <h3 className="font-semibold text-warm text-lg mb-1">Showa Era Nostalgia Town</h3>
                      <p className="text-amber-700 text-sm leading-relaxed">
                        Famous for preserving the authentic atmosphere of 1950s-80s Japan.
                        Our retro shopping streets, vintage festivals, and community warmth
                        attract visitors seeking genuine connection.
                      </p>
                    </div>
                  </div>
                </div>

                {/* Vision Statement */}
                <div className="bg-gradient-to-r from-amber-600 to-orange-500 text-white rounded-2xl p-6 mb-8">
                  <p className="text-lg font-medium mb-2">Our Vision</p>
                  <p className="text-amber-100 leading-relaxed">
                    "We're building a community where young families can raise children
                    surrounded by genuine neighborly care—where elders are valued teachers,
                    not forgotten, and where every child knows their neighbors by name."
                  </p>
                </div>

                {/* Who We're Looking For */}
                <div className="mb-8">
                  <p className="text-sm font-semibold text-amber-800 mb-3 uppercase tracking-wide">We're seeking families who value:</p>
                  <div className="flex flex-wrap gap-2">
                    {['Intergenerational connection', 'Slow living', 'Community participation', 'Eldercare mindset', 'Child-centered lifestyle'].map(tag => (
                      <span key={tag} className="bg-amber-100 text-amber-800 px-3 py-1.5 rounded-full text-sm font-medium">
                        {tag}
                      </span>
                    ))}
                  </div>
                </div>
              </div>

              {/* Right: Quick Stats + Progress */}
              <div className="space-y-6">
                {/* Population Card */}
                <div className="bg-white rounded-2xl p-6 shadow-warm border border-amber-100 card-hover">
                  <div className="flex justify-between items-start mb-4">
                    <div>
                      <p className="text-sm text-amber-600 font-medium mb-1">Current Population</p>
                      <p className="text-4xl font-bold text-warm">22,500</p>
                    </div>
                    <div className="text-right">
                      <p className="text-sm text-amber-600 font-medium mb-1">Trend</p>
                      <p className="text-sm text-amber-700">-2.1% yearly <span className="text-amber-500">(changing soon)</span></p>
                    </div>
                  </div>
                  <div className="h-2 bg-amber-100 rounded-full overflow-hidden">
                    <div className="h-full bg-gradient-to-r from-amber-400 to-orange-400 rounded-full" style={{width: '75%'}}></div>
                  </div>
                  <p className="text-xs text-amber-600 mt-2">With 50 new families, we project +0.5% growth</p>
                </div>

                {/* Commitment Preview */}
                <div className="bg-gradient-to-br from-emerald-50 to-teal-50 rounded-2xl p-6 border border-emerald-200 card-hover">
                  <div className="flex items-center justify-between mb-4">
                    <div className="flex items-center gap-2">
                      <div className="w-3 h-3 rounded-full bg-emerald-500 pulse-gentle"></div>
                      <span className="text-sm font-semibold text-emerald-800">Cohort Forming Now</span>
                    </div>
                    <span className="text-xs bg-emerald-200 text-emerald-800 px-2 py-1 rounded-full">Wave 3</span>
                  </div>
                  <div className="flex items-end gap-4 mb-4">
                    <div>
                      <span className="text-5xl font-bold text-emerald-700">47</span>
                      <span className="text-2xl text-emerald-600">/50</span>
                    </div>
                    <p className="text-emerald-700 mb-2">families committed</p>
                  </div>
                  <div className="h-4 bg-emerald-100 rounded-full overflow-hidden mb-3">
                    <div className="progress-fill h-full rounded-full" style={{width: '94%'}}></div>
                  </div>
                  <p className="text-sm text-emerald-700">
                    <strong>3 more families</strong> unlock ¥20M additional support
                  </p>
                </div>

                {/* Quick Access Cards */}
                <div className="grid grid-cols-2 gap-4">
                  <div className="bg-white rounded-xl p-4 shadow-warm border border-amber-100 card-hover cursor-pointer">
                    <Icons.Calendar />
                    <p className="text-sm font-semibold text-warm mt-2">12 events</p>
                    <p className="text-xs text-amber-600">this month</p>
                  </div>
                  <div className="bg-white rounded-xl p-4 shadow-warm border border-amber-100 card-hover cursor-pointer">
                    <Icons.Briefcase />
                    <p className="text-sm font-semibold text-warm mt-2">127 jobs</p>
                    <p className="text-xs text-amber-600">pledged</p>
                  </div>
                  <div className="bg-white rounded-xl p-4 shadow-warm border border-amber-100 card-hover cursor-pointer">
                    <Icons.Home />
                    <p className="text-sm font-semibold text-warm mt-2">23 akiya</p>
                    <p className="text-xs text-amber-600">available</p>
                  </div>
                  <div className="bg-white rounded-xl p-4 shadow-warm border border-amber-100 card-hover cursor-pointer">
                    <Icons.Building />
                    <p className="text-sm font-semibold text-warm mt-2">8 companies</p>
                    <p className="text-xs text-amber-600">interested</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
      );
    };

    // ==========================================
    // SECTION 2: SOCIAL CALENDAR (PROOF OF LIFE)
    // ==========================================
    const SocialCalendarSection = () => {
      const [activeTab, setActiveTab] = useState('thisWeek');

      const thisWeekEvents = [
        { day: 'Mon', date: '15', time: '18:00', title: 'Community Dinner', location: 'Showa Street Hall', type: 'social', attendees: 24, spots: 30 },
        { day: 'Tue', date: '16', time: '10:00', title: 'Morning Exercise Group', location: 'Riverside Park', type: 'wellness', attendees: 12, recurring: true },
        { day: 'Wed', date: '17', time: '15:00', title: 'Newcomer Welcome Tea', location: 'Community Center', type: 'newcomer', attendees: 8, spots: 15 },
        { day: 'Thu', date: '18', time: '19:00', title: 'Town Planning Discussion', location: 'Town Hall', type: 'townhall', attendees: 31 },
        { day: 'Fri', date: '19', time: '17:00', title: 'Kids After-School Club', location: 'Elementary School', type: 'family', attendees: 15 },
        { day: 'Sat', date: '20', time: '09:00', title: 'Showa Market Morning', location: 'Main Street', type: 'festival', attendees: 'Open' },
        { day: 'Sun', date: '21', time: '11:00', title: 'Temple Garden Cleanup', location: 'Kumano Shrine', type: 'community', attendees: 18 },
      ];

      const upcomingEvents = [
        { date: 'Jan 28', title: 'Showa Retro Festival', type: 'festival', description: 'Annual celebration with vintage cars, music, and street food' },
        { date: 'Feb 3', title: 'Setsubun Bean Throwing', type: 'tradition', description: 'Traditional spring ceremony at the shrine' },
        { date: 'Feb 14', title: 'Community Mochi Making', type: 'social', description: 'Learn traditional rice cake making with elders' },
        { date: 'Mar 3', title: "Hina Matsuri (Girls' Day)", type: 'tradition', description: 'Town-wide doll display and celebration' },
      ];

      const regularActivities = [
        { frequency: 'Every Monday', title: 'Community Dinner', time: '18:00', organizer: 'Tanaka-san' },
        { frequency: 'Tue/Thu/Sat', title: 'Morning Radio Exercise', time: '06:30', organizer: 'Health Committee' },
        { frequency: 'Every Wednesday', title: 'Knitting Circle', time: '14:00', organizer: 'Sato-san' },
        { frequency: 'Every Friday', title: "Children's Story Hour", time: '16:00', organizer: 'Library' },
        { frequency: '1st Saturday', title: 'Newcomer Orientation', time: '10:00', organizer: 'Town Hall' },
        { frequency: '3rd Sunday', title: 'Community Cleanup Day', time: '08:00', organizer: 'Neighborhood Assoc.' },
      ];

      const recentTownHall = [
        { date: '2 days ago', title: 'Childcare Expansion Vote', result: 'Approved', votes: '42-3' },
        { date: '1 week ago', title: 'New Family Support Budget', result: 'In Progress', notes: 'Committee formed' },
        { date: '2 weeks ago', title: 'Community Garden Proposal', result: 'Approved', votes: '38-7' },
      ];

      const getTypeColor = (type) => {
        const colors = {
          social: 'bg-blue-100 text-blue-700 border-blue-200',
          wellness: 'bg-green-100 text-green-700 border-green-200',
          newcomer: 'bg-purple-100 text-purple-700 border-purple-200',
          townhall: 'bg-amber-100 text-amber-700 border-amber-200',
          family: 'bg-pink-100 text-pink-700 border-pink-200',
          festival: 'bg-orange-100 text-orange-700 border-orange-200',
          community: 'bg-teal-100 text-teal-700 border-teal-200',
          tradition: 'bg-red-100 text-red-700 border-red-200',
        };
        return colors[type] || 'bg-gray-100 text-gray-700';
      };

      return (
        <section id="calendar" className="py-20 bg-white">
          <div className="max-w-6xl mx-auto px-6">
            {/* Section Header */}
            <div className="text-center mb-12">
              <div className="inline-flex items-center gap-2 bg-green-100 text-green-700 px-4 py-2 rounded-full text-sm font-medium mb-4">
                <div className="w-2 h-2 rounded-full bg-green-500 pulse-gentle"></div>
                Community is Active
              </div>
              <h2 className="font-display text-4xl lg:text-5xl text-warm mb-4">Life Happens Here</h2>
              <p className="text-xl text-amber-700 max-w-2xl mx-auto">
                See what's happening this week. Imagine yourself at that dinner,
                your kids at that festival, your morning starting with neighbors.
              </p>
            </div>

            {/* Tab Navigation */}
            <div className="flex justify-center gap-2 mb-8">
              {[
                { id: 'thisWeek', label: 'This Week' },
                { id: 'upcoming', label: 'Upcoming' },
                { id: 'regular', label: 'Regular Activities' },
                { id: 'townhall', label: 'Town Hall' },
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`px-6 py-3 rounded-full font-medium transition ${
                    activeTab === tab.id
                      ? 'bg-amber-600 text-white'
                      : 'bg-amber-50 text-amber-700 hover:bg-amber-100'
                  }`}
                >
                  {tab.label}
                </button>
              ))}
            </div>

            {/* This Week View */}
            {activeTab === 'thisWeek' && (
              <div className="grid gap-3">
                {thisWeekEvents.map((event, idx) => (
                  <div key={idx} className="bg-warm rounded-xl p-4 flex items-center gap-4 card-hover border border-amber-100">
                    {/* Date */}
                    <div className="text-center w-16 flex-shrink-0">
                      <p className="text-xs text-amber-600 font-medium uppercase">{event.day}</p>
                      <p className="text-2xl font-bold text-warm">{event.date}</p>
                    </div>

                    {/* Divider */}
                    <div className="w-px h-12 bg-amber-200"></div>

                    {/* Event Details */}
                    <div className="flex-1">
                      <div className="flex items-center gap-2 mb-1">
                        <h3 className="font-semibold text-warm">{event.title}</h3>
                        {event.recurring && (
                          <span className="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full">Weekly</span>
                        )}
                      </div>
                      <div className="flex items-center gap-4 text-sm text-amber-600">
                        <span className="flex items-center gap-1">
                          <Icons.Clock />
                          {event.time}
                        </span>
                        <span className="flex items-center gap-1">
                          <Icons.MapPin />
                          {event.location}
                        </span>
                      </div>
                    </div>

                    {/* Type Badge & Attendees */}
                    <div className="flex items-center gap-4">
                      <span className={`px-3 py-1 rounded-full text-xs font-medium border ${getTypeColor(event.type)}`}>
                        {event.type}
                      </span>
                      <div className="text-right">
                        <p className="text-sm font-medium text-warm">
                          {event.attendees === 'Open' ? 'Open event' : `${event.attendees}${event.spots ? `/${event.spots}` : ''}`}
                        </p>
                        {event.spots && event.attendees !== 'Open' && (
                          <p className="text-xs text-amber-600">{event.spots - event.attendees} spots left</p>
                        )}
                      </div>
                    </div>

                    {/* Action */}
                    <button className="px-4 py-2 bg-amber-600 text-white rounded-lg text-sm font-medium hover:bg-amber-700 transition">
                      I'm interested
                    </button>
                  </div>
                ))}
              </div>
            )}

            {/* Upcoming Events */}
            {activeTab === 'upcoming' && (
              <div className="grid md:grid-cols-2 gap-6">
                {upcomingEvents.map((event, idx) => (
                  <div key={idx} className="bg-warm rounded-xl p-6 card-hover border border-amber-100">
                    <div className="flex justify-between items-start mb-3">
                      <span className={`px-3 py-1 rounded-full text-xs font-medium border ${getTypeColor(event.type)}`}>
                        {event.type}
                      </span>
                      <span className="text-sm font-medium text-amber-600">{event.date}</span>
                    </div>
                    <h3 className="text-xl font-semibold text-warm mb-2">{event.title}</h3>
                    <p className="text-amber-700">{event.description}</p>
                    <button className="mt-4 text-amber-600 font-medium text-sm flex items-center gap-1 hover:text-amber-700">
                      Remind me <Icons.ArrowRight />
                    </button>
                  </div>
                ))}
              </div>
            )}

            {/* Regular Activities */}
            {activeTab === 'regular' && (
              <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
                {regularActivities.map((activity, idx) => (
                  <div key={idx} className="bg-warm rounded-xl p-5 card-hover border border-amber-100">
                    <p className="text-xs font-semibold text-amber-600 uppercase tracking-wide mb-2">{activity.frequency}</p>
                    <h3 className="font-semibold text-warm mb-1">{activity.title}</h3>
                    <p className="text-sm text-amber-700 mb-3">Starts at {activity.time}</p>
                    <p className="text-xs text-amber-500">Organized by {activity.organizer}</p>
                  </div>
                ))}
              </div>
            )}

            {/* Town Hall Activity */}

                      <div className="flex gap-2 mt-3">
                        {job.training && (
                          <span className="text-xs bg-green-100 text-green-700 px-2 py-1 rounded-full">Training provided</span>
                        )}
                        <span className={`text-xs px-2 py-1 rounded-full ${
                          job.committed ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'
                        }`}>
                          {job.committed ? 'Company committed' : 'Pending threshold'}
                        </span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {/* Internal Venture Matches */}
              <div>
                <h3 className="text-2xl font-semibold text-warm mb-6">Skill Matches in Our Cohort</h3>
                <p className="text-sm text-amber-600 mb-4">Families in Wave 3 already bring these skills:</p>
                <div className="space-y-4">
                  {internalMatches.map((match, idx) => (
                    <div key={idx} className="bg-white rounded-xl p-5 shadow-warm border border-amber-100">
                      <div className="flex justify-between items-center mb-2">
                        <h4 className="font-medium text-warm">{match.skill}</h4>
                        <span className={`px-3 py-1 rounded-full text-xs font-medium ${
                          match.match === 'excellent' ? 'bg-emerald-100 text-emerald-700' :
                          match.match === 'strong' ? 'bg-blue-100 text-blue-700' :
                          'bg-amber-100 text-amber-700'
                        }`}>
                          {match.match} match
                        </span>
                      </div>
                      <div className="flex items-center gap-4">
                        <div className="flex-1">
                          <div className="h-2 bg-gray-100 rounded-full overflow-hidden">
                            <div
                              className="h-full bg-gradient-to-r from-blue-400 to-indigo-400 rounded-full"
                              style={{width: `${Math.min((match.families / match.needed) * 100, 100)}%`}}
                            ></div>
                          </div>
                        </div>
                        <span className="text-sm text-amber-700">
                          {match.families} / {match.needed} needed
                        </span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </section>
      );
    };

    // ==========================================
    // SECTION 6: COMMUNITY VOICES
    // ==========================================
    const CommunityVoicesSection = () => {
      const voices = [
        {
          quote: "Moving here was the best decision we made for our children. They know every shop owner by name, and the grandparents next door treat them like their own.",
          name: "Yuki Yamamoto",
          role: "Moved from Tokyo, 2 years ago",
          avatar: "Y",
          type: "newcomer"
        },
        {
          quote: "I was skeptical about leaving my career, but the remote work setup here is excellent, and my stress has disappeared. I actually talk to my neighbors now.",
          name: "Ken Tanaka",
          role: "IT professional, moved from Osaka",
          avatar: "K",
          type: "newcomer"
        },
        {
          quote: "Young families bring life back to our streets. Seeing children run through the Showa market again—that's what we've been hoping for.",
          name: "Grandmother Sato",
          role: "Bungotakada resident, 78 years",
          avatar: "S",
          type: "resident"
        },
        {
          quote: "We're not just filling empty houses. We're building a model for how Japanese communities can thrive again. Every family that commits makes the next one easier.",
          name: "Mayor Nakamura",
          role: "Mayor of Bungotakada",
          avatar: "M",
          type: "official"
        },
      ];

      const getTypeStyle = (type) => {
        switch(type) {
          case 'newcomer': return 'border-emerald-200 bg-emerald-50';
          case 'resident': return 'border-amber-200 bg-amber-50';
          case 'official': return 'border-blue-200 bg-blue-50';
          default: return 'border-gray-200 bg-gray-50';
        }
      };

      const getTypeLabel = (type) => {
        switch(type) {
          case 'newcomer': return { text: 'Recent Arrival', color: 'text-emerald-700 bg-emerald-100' };
          case 'resident': return { text: 'Long-time Resident', color: 'text-amber-700 bg-amber-100' };
          case 'official': return { text: 'Town Leadership', color: 'text-blue-700 bg-blue-100' };
          default: return { text: '', color: '' };
        }
      };

      return (
        <section className="py-20 bg-white">
          <div className="max-w-6xl mx-auto px-6">
            {/* Section Header */}
            <div className="text-center mb-12">
              <h2 className="font-display text-4xl lg:text-5xl text-warm mb-4">Community Voices</h2>
              <p className="text-xl text-amber-700 max-w-2xl mx-auto">
                Hear from those already here—newcomers who took the leap,
                long-time residents welcoming change, and leaders building the future.
              </p>
            </div>

            {/* Voices Grid */}
            <div className="grid md:grid-cols-2 gap-8 mb-12">
              {voices.map((voice, idx) => (
                <div key={idx} className={`rounded-2xl p-6 border-2 ${getTypeStyle(voice.type)} card-hover`}>
                  <div className="text-amber-300 mb-4">
                    <Icons.Quote />
                  </div>
                  <p className="text-lg text-warm leading-relaxed mb-6 italic">
                    "{voice.quote}"
                  </p>
                  <div className="flex items-center gap-4">
                    <div className="w-12 h-12 rounded-full bg-amber-200 flex items-center justify-center font-bold text-amber-700">
                      {voice.avatar}
                    </div>
                    <div className="flex-1">
                      <p className="font-semibold text-warm">{voice.name}</p>
                      <p className="text-sm text-amber-600">{voice.role}</p>
                    </div>
                    <span className={`px-3 py-1 rounded-full text-xs font-medium ${getTypeLabel(voice.type).color}`}>
                      {getTypeLabel(voice.type).text}
                    </span>
                  </div>
                </div>
              ))}
            </div>

            {/* Connect CTA */}
            <div className="bg-gradient-to-r from-amber-600 to-orange-500 rounded-2xl p-8 text-center text-white">
              <h3 className="text-2xl font-semibold mb-4">Want to talk to someone who's been there?</h3>
              <p className="text-amber-100 mb-6 max-w-xl mx-auto">
                We can connect you with families who've made the move—ask them anything about
                daily life, schools, work, or how they made the decision.
              </p>
              <button className="bg-white text-amber-700 px-8 py-3 rounded-full font-semibold hover:bg-amber-50 transition">
                Request a conversation
              </button>
            </div>
          </div>
        </section>
      );
    };

    // ==========================================
    // FOOTER
    // ==========================================
    const Footer = () => {
      return (
        <footer className="bg-warm py-12 border-t border-amber-200">
          <div className="max-w-6xl mx-auto px-6">
            <div className="grid md:grid-cols-4 gap-8 mb-8">
              <div>
                <h4 className="font-bold text-warm text-lg mb-4">Famichi</h4>
                <p className="text-sm text-amber-700">
                  Enabling synchronized rural migration for families seeking community.
                </p>
              </div>
              <div>
                <h5 className="font-semibold text-warm mb-3">Explore</h5>
                <ul className="space-y-2 text-sm text-amber-600">
                  <li><a href="#" className="hover:text-amber-800">Browse Towns</a></li>
                  <li><a href="#" className="hover:text-amber-800">Compare Communities</a></li>
                  <li><a href="#" className="hover:text-amber-800">Success Stories</a></li>
                </ul>
              </div>
              <div>
                <h5 className="font-semibold text-warm mb-3">For Families</h5>
                <ul className="space-y-2 text-sm text-amber-600">
                  <li><a href="#" className="hover:text-amber-800">How It Works</a></li>
                  <li><a href="#" className="hover:text-amber-800">FAQ</a></li>
                  <li><a href="#" className="hover:text-amber-800">Talk to Movers</a></li>
                </ul>
              </div>
              <div>
                <h5 className="font-semibold text-warm mb-3">For Towns</h5>
                <ul className="space-y-2 text-sm text-amber-600">
                  <li><a href="#" className="hover:text-amber-800">Partner With Us</a></li>
                  <li><a href="#" className="hover:text-amber-800">Town Toolkit</a></li>
                  <li><a href="#" className="hover:text-amber-800">Case Studies</a></li>
                </ul>
              </div>
            </div>
            <div className="border-t border-amber-200 pt-8 flex flex-col md:flex-row justify-between items-center">
              <p className="text-sm text-amber-600">© 2025 Famichi. Building communities, one family at a time.</p>
              <div className="flex gap-4 mt-4 md:mt-0">
                <a href="#" className="text-amber-600 hover:text-amber-800 text-sm">Privacy</a>
                <a href="#" className="text-amber-600 hover:text-amber-800 text-sm">Terms</a>
                <a href="#" className="text-amber-600 hover:text-amber-800 text-sm">Contact</a>
              </div>
            </div>
          </div>
        </footer>
      );
    };

    // ==========================================
    // MAIN APP
    // ==========================================
    const App = () => {
      return (
        <div className="min-h-screen">
          <HeroSection />
          <SocialCalendarSection />
          <CommitmentTrackerSection />
          <OffersNeedsSection />
          <EconomicOpportunitiesSection />
          <CommunityVoicesSection />
          <Footer />
        </div>
      );
    };

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
