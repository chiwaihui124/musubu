/* ═══════════════════════════════════════════════════════════ */
function App(){
  const [lang,setLang]        = useState('en');
  const [sel,setSel]          = useState(null);
  const [month,setMonth]      = useState(0);
  const [projected,setProj]   = useState(false);
  const [layers,setLayers]    = useState({ alive:true, char:false, tiles:true, people:false });
  const L = (o,k='en') => lang==='ja' ? (o.ja ?? o[k]) : o[k];

  /* Is this tile on the committed track — i.e. does it happen regardless? */
  const isCommitted = (t) => ['open','building','committed','threshold_met'].includes(t.state);

  /* State of a tile at the scrubbed month.
     Committed tiles advance on their own. Gathering/proposed tiles only advance
     in projected mode — in committed mode they stay frozen, which is the honest view. */
  const stateAt = (t) => {
    if (t.state==='lapsed') return month >= -2 ? 'lapsed' : 'gathering';
    if (isCommitted(t)) {
      if (t.m === null) return t.state;
      return month >= t.m ? 'open' : (month >= t.m - 3 ? 'building' : 'gathering');
    }
    if (!projected || month <= 0 || t.m === null) return t.state;
    if (month >= t.m)     return 'open';
    if (month >= t.m - 3) return 'building';
    return t.state;
  };

  /* Everything stays on the map. Uncertainty is communicated by styling, never by hiding. */
  const isGhost = (t) => projected && month > 0 && !isCommitted(t) && month >= t.m - 3;

  const pop = useMemo(()=>{
    const base = 22500;
    const committedPer = 2.1;
    let n = 0;
    TILES.forEach(t=>{
      if (t.m===null) return;
      if (!projected && (t.state==='gathering'||t.state==='proposed')) return;
      if (month >= t.m && ['housing_cluster','co_living_build'].includes(t.type)) n += t.tgt*committedPer;
    });
    return Math.round(base + n);
  },[month,projected]);

  const monthLabel = (m)=>{
    const d = new Date(2026,7,1); d.setMonth(d.getMonth()+m);
    return d.toLocaleDateString(lang==='ja'?'ja-JP':'en-GB',{month:'short',year:'numeric'});
  };

  return (
    <div className="min-h-screen bg-cream">
      {/* header */}
      <div className="border-b border-amber-100 bg-warm">
        <div className="max-w-[1500px] mx-auto px-6 py-4 flex items-center justify-between flex-wrap gap-3">
          <div>
            <h1 className="font-display text-2xl text-warm">
              {lang==='ja' ? '結ぶ — 豊後高田' : 'Musubu — Bungotakada'}
            </h1>
            <p className="text-xs text-amber-700/70 mt-0.5">
              {lang==='ja' ? '起こりうることの地図 — v1 試作' : 'The map of what could happen — v1 prototype'}
            </p>
          </div>
          <div className="flex items-center gap-2">
            {LAYERS.map(l=>(
              <button key={l.id} onClick={()=>setLayers(s=>({...s,[l.id]:!s[l.id]}))}
                className={`px-3 py-1.5 rounded-full text-xs border transition ${layers[l.id]
                  ? 'bg-amber-600 text-white border-amber-600'
                  : 'bg-white text-amber-800 border-amber-200 hover:border-amber-400'}`}>
                {L(l)}
              </button>
            ))}
            <button onClick={()=>setLang(lang==='en'?'ja':'en')}
              className="ml-2 px-3 py-1.5 rounded-full text-xs bg-white border border-amber-200 text-amber-800">
              {lang==='en' ? '日本語' : 'EN'}
            </button>
          </div>
        </div>
      </div>

      <div className="max-w-[1500px] mx-auto px-6 py-5 grid grid-cols-1 lg:grid-cols-[1fr_380px] gap-5">

        {/* ── MAP ── */}
        <div>
          <div className="rounded-2xl overflow-hidden border border-amber-100 shadow-sm bg-[#f6f1e7]">
            <svg viewBox="0 0 1000 700" className="w-full block">
              <defs>
                <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor="#a8d5e2"/><stop offset="100%" stopColor="#cfe6ed"/>
                </linearGradient>
                <linearGradient id="hill" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stopColor="#e4e9d8"/><stop offset="100%" stopColor="#cfd9bd"/>
                </linearGradient>
              </defs>

              {/* land base */}
              <rect width="1000" height="700" fill="#f3ecdf"/>

              {/* paddy plain texture, west */}
              <g opacity=".5">
                {Array.from({length:26}).map((_,i)=>(
                  <line key={i} x1="20" y1={250+i*17} x2="390" y2={238+i*17} stroke="#e2dcc6" strokeWidth="1.5"/>
                ))}
                {Array.from({length:14}).map((_,i)=>(
                  <line key={'v'+i} x1={30+i*27} y1="245" x2={26+i*27} y2="690" stroke="#e2dcc6" strokeWidth="1"/>
                ))}
              </g>

              {/* hills, east + southeast */}
              <path d="M 660 250 Q 800 200 1000 240 L 1000 700 L 600 700 Q 640 480 660 250 Z" fill="url(#hill)"/>
              <g opacity=".45" stroke="#b9c5a2" fill="none" strokeWidth="1.2">
                <path d="M 700 320 Q 830 290 980 320"/>
                <path d="M 700 400 Q 840 372 980 400"/>
                <path d="M 690 490 Q 840 462 980 486"/>
                <path d="M 670 580 Q 820 556 980 578"/>
                <path d="M 655 660 Q 810 640 980 662"/>
              </g>

              {/* sea — Suo-nada, opening north-west */}
              <path d="M 0 0 L 1000 0 L 1000 70 Q 760 96 600 128
                       Q 470 152 432 214 Q 400 268 300 288
                       Q 160 312 0 268 Z" fill="url(#sea)"/>

              {/* Katsura river: SE → centre → north to sea */}
              <path d="M 980 640 Q 800 600 700 540 Q 600 490 520 470 Q 470 460 455 400 Q 445 320 448 240 Q 450 190 425 155"
                    stroke="#9ec9dd" strokeWidth="13" fill="none" strokeLinecap="round"/>
              <path d="M 300 700 Q 330 560 400 480 Q 440 440 452 400"
                    stroke="#9ec9dd" strokeWidth="7" fill="none" strokeLinecap="round"/>

              {/* roads */}
              <path d="M 250 700 Q 330 520 420 420 Q 470 360 500 250 Q 520 160 560 0"
                    stroke="#efc75e" strokeWidth="7" fill="none"/>
              <path d="M 0 620 Q 200 600 340 640 Q 500 690 700 660"
                    stroke="#e9d9b0" strokeWidth="5" fill="none"/>
              <path d="M 470 470 Q 640 450 820 430 Q 920 420 1000 440"
                    stroke="#e9d9b0" strokeWidth="5" fill="none"/>

              {/* district character */}
              {layers.char && DISTRICTS.map((d,i)=>(
                <path key={i} d={d.d} fill={d.c} opacity=".17" stroke={d.c} strokeWidth="1.5" strokeDasharray="5 4"/>
              ))}
              {layers.char && DISTRICTS.map((d,i)=>{
                const pts = d.d.match(/-?\d+(\.\d+)?/g).map(Number);
                const xs=[],ys=[]; for(let j=0;j<pts.length;j+=2){xs.push(pts[j]);ys.push(pts[j+1]);}
                const cx = xs.reduce((a,b)=>a+b,0)/xs.length, cy = ys.reduce((a,b)=>a+b,0)/ys.length;
                return <text key={'t'+i} x={cx} y={cy} textAnchor="middle"
                  className="text-[11px]" fill="#7a6a52" opacity=".85">{L(d)}</text>;
              })}

              {/* place labels */}
              <g fill="#8a7a62" className="text-[10px]" opacity=".8">
                <text x="470" y="330" textAnchor="middle">Tamatsu 玉津</text>
                <text x="455" y="560" textAnchor="middle">Shinmachi 新町</text>
                <text x="545" y="480" textAnchor="middle">Takada 高田</text>
                <text x="790" y="470" textAnchor="middle">Miwa 三和</text>
                <text x="180" y="500" textAnchor="middle">Mizusaki 水崎</text>
                <text x="150" y="330" textAnchor="middle">Suo-nada 周防灘</text>
                <text x="850" y="620" textAnchor="middle">Mori 森</text>
              </g>

              {/* L1 already alive */}
              {layers.alive && ALIVE.map((a,i)=>(
                <g key={i} transform={`translate(${a.x*1000} ${a.y*700})`}>
                  <circle r="9" fill="#fffbf5" stroke="#c8b49a" strokeWidth="1.5"/>
                  <text y="3.5" textAnchor="middle" className="text-[9px]" fill="#8b7355">{ALIVE_ICON[a.k]}</text>
                  <text y="-13" textAnchor="middle" className="text-[8.5px]" fill="#8b7355" opacity=".9">{L(a)}</text>
                </g>
              ))}

              {/* people layer */}
              {layers.people && TILES.filter(t=>Object.keys(t.comp||{}).length).map(t=>{
                const n = Object.values(t.comp).reduce((a,b)=>a+b,0);
                return <circle key={'p'+t.id} cx={t.x*1000} cy={t.y*700} r={Math.min(46,10+n*1.5)}
                  fill="#f59e0b" opacity=".13"/>;
              })}

              {/* TILES */}
              {layers.tiles && TILES.map(t=>{
                const st = stateAt(t);
                const s  = STATE_STYLE[st];
                const isSel = sel===t.id;
                const pct = Math.min(1, t.cur/t.tgt);
                const ghost = isGhost(t);
                return (
                  <g key={t.id} transform={`translate(${t.x*1000} ${t.y*700})`} opacity={ghost?.55:1}>
                    <g className={`pin ${isSel?'pin-sel':''}`} onClick={()=>setSel(isSel?null:t.id)}>
                      <circle r="16" fill={s.fill} stroke={s.ring} strokeWidth="2.5"
                              strokeDasharray={ghost?'4 3':'none'}/>
                      {['gathering','proposed'].includes(st) && (
                        <path d={describeArc(0,0,16,0,pct*360)} fill="none" stroke="#fffbf5"
                              strokeWidth="3.5" strokeLinecap="round"/>
                      )}
                      <text y="4" textAnchor="middle" className="text-[10px] font-bold" fill="#fffbf5">
                        {st==='open'?'✓':st==='lapsed'?'—':Math.round(pct*100)}
                      </text>
                    </g>
                  </g>
                );
              })}
            </svg>
          </div>

          {/* ── SCRUBBER ── */}
          <div className="mt-4 rounded-2xl border border-amber-100 bg-warm p-4">
            <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
              <div className="flex items-baseline gap-3">
                <span className="font-display text-lg text-warm">{monthLabel(month)}</span>
                <span className="text-xs text-amber-700/70">
                  {lang==='ja' ? `推定人口 ${pop.toLocaleString()}` : `population ${pop.toLocaleString()}`}
                </span>
              </div>
              <div className="flex gap-1.5 bg-white rounded-full p-1 border border-amber-200">
                <button onClick={()=>setProj(false)}
                  className={`px-3 py-1 rounded-full text-[11px] ${!projected?'bg-emerald-600 text-white':'text-amber-800'}`}>
                  {lang==='ja'?'確定分のみ':'Committed only'}
                </button>
                <button onClick={()=>setProj(true)}
                  className={`px-3 py-1 rounded-full text-[11px] ${projected?'bg-amber-500 text-white':'text-amber-800'}`}>
                  {lang==='ja'?'募集中も含む（見込み）':'If gathering succeeds'}
                </button>
              </div>
            </div>
            <input type="range" min="-24" max="36" value={month}
                   onChange={e=>setMonth(+e.target.value)} className="w-full"/>
            <div className="flex justify-between text-[10px] text-amber-700/60 mt-1.5">
              <span>−24 {lang==='ja'?'ヶ月':'mo'}</span><span>{lang==='ja'?'今日':'today'}</span><span>+36 {lang==='ja'?'ヶ月':'mo'}</span>
            </div>
            {projected && (
              <p className="mt-2 text-[11px] text-amber-700 bg-amber-100/70 rounded-lg px-3 py-2">
                {lang==='ja'
                  ? '破線＝まだ確定していません。募集中のタイルがすべて成立した場合の見込みです。'
                  : 'Dashed = not committed. This view assumes every gathering tile reaches its threshold.'}
              </p>
            )}
          </div>
        </div>

        {/* ── SIDE PANEL ── */}
        <div className="lg:sticky lg:top-5 h-fit">
          {sel ? <TileCard t={TILES.find(x=>x.id===sel)} lang={lang} L={L}
                           onClose={()=>setSel(null)} onJump={setSel}/>
               : <Legend lang={lang} L={L}/>}
        </div>
      </div>

      <div className="max-w-[1500px] mx-auto px-6 pb-10 pt-2">
        <p className="text-[11px] text-amber-700/60 leading-relaxed">
          {lang==='ja'
            ? '試作版。地形は Mapbox のスクリーンショットから起こした概略図で、測量ではありません。空き家価格は集約サイト由来の参考値で、市の空き家バンクでの確認が必要です。成蹊幼稚園は地図上「休園中」と表示されており、現況は市への確認が必要です。'
            : 'Prototype. The base is an illustrated approximation drawn from the supplied Mapbox captures — not a survey. Akiya prices are aggregator-sourced and need verification against the municipal 空き家バンク. Seikei Kindergarten is labelled 休園中 (suspended) on the map; current status needs confirming with the city.'}
        </p>
      </div>
    </div>
  );
}

/* ── tile card ── */
function TileCard({t,lang,L,onClose,onJump}){
  const s = STATE_STYLE[t.state];
  const pct = Math.min(100, Math.round(t.cur/t.tgt*100));
  const total = Object.values(t.comp||{}).reduce((a,b)=>a+b,0);
  return (
    <div className="rounded-2xl border border-amber-200 bg-white shadow-sm overflow-hidden">
      <div className="px-5 py-4" style={{background:`linear-gradient(135deg, ${s.fill}22, ${s.fill}0a)`}}>
        <div className="flex justify-between items-start gap-3">
          <div>
            <div className="flex items-center gap-2 mb-1">
              <span className="px-2 py-0.5 rounded-full text-[10px] font-medium text-white" style={{background:s.ring}}>
                {lang==='ja'?s.ja:s.label}
              </span>
              <span className="text-[10px] text-amber-800/70">{TYPE_LABEL[t.type]}</span>
            </div>
            <h2 className="font-display text-lg text-warm leading-snug">{L(t)}</h2>
          </div>
          <button onClick={onClose} className="text-amber-700/50 hover:text-amber-800 text-lg leading-none">×</button>
        </div>
      </div>

      <div className="px-5 py-4 space-y-4 max-h-[64vh] overflow-y-auto scroll-thin">
        <p className="text-sm text-stone-600 leading-relaxed">{t.blurb}</p>

        {/* the number */}
        {t.state!=='open' && (
          <div>
            <div className="flex justify-between items-baseline mb-1.5">
              <span className="text-sm font-semibold text-warm">{t.cur} / {t.tgt} <span className="font-normal text-xs text-stone-500">{t.unit}</span></span>
              {t.deadline && <span className="text-[11px] text-amber-700/70">by {t.deadline}</span>}
            </div>
            <div className="h-2.5 rounded-full bg-amber-100 overflow-hidden">
              <div className="h-full rounded-full transition-all" style={{width:pct+'%',background:s.fill}}/>
            </div>
          </div>
        )}

        {/* terms */}
        <div className="rounded-xl bg-warm px-3 py-2.5">
          <div className="text-[10px] uppercase tracking-wide text-amber-700/60 mb-0.5">
            {lang==='ja'?'条件':'Terms'}
          </div>
          <div className="text-sm text-stone-700">{t.rent}</div>
        </div>

        {/* walk to */}
        {t.walkTo.length>0 && (
          <div>
            <div className="text-[10px] uppercase tracking-wide text-amber-700/60 mb-1.5">
              {lang==='ja'?'徒歩圏':'Walk to'}
            </div>
            <div className="flex flex-wrap gap-1.5">
              {t.walkTo.map(([w,m],i)=>(
                <span key={i} className="text-[11px] bg-stone-100 rounded-full px-2.5 py-1 text-stone-600">
                  {w} · {m}min
                </span>
              ))}
            </div>
          </div>
        )}

        {/* who else is in */}
        {total>0 && (
          <div>
            <div className="text-[10px] uppercase tracking-wide text-amber-700/60 mb-1.5">
              {lang==='ja'?`すでに参加している ${total}人`:`Who else is in — ${total}`}
            </div>
            <div className="flex h-6 rounded-lg overflow-hidden">
              {Object.entries(t.comp).map(([k,v],i)=>(
                <div key={k} title={`${k}: ${v}`}
                     style={{width:(v/total*100)+'%', background:['#f59e0b','#fbbf24','#fcd34d'][i%3]}}
                     className="flex items-center justify-center text-[9px] text-white font-medium">
                  {v}
                </div>
              ))}
            </div>
            <div className="flex gap-3 mt-1.5">
              {Object.keys(t.comp).map((k,i)=>(
                <span key={k} className="text-[10px] text-stone-500 flex items-center gap-1">
                  <span className="w-2 h-2 rounded-sm" style={{background:['#f59e0b','#fbbf24','#fcd34d'][i%3]}}/>{k}
                </span>
              ))}
            </div>
          </div>
        )}

        {/* what it unlocks */}
        {t.unlocks.length>0 && (
          <div className="rounded-xl border border-emerald-200 bg-emerald-50/60 px-3 py-2.5">
            <div className="text-[10px] uppercase tracking-wide text-emerald-800/70 mb-1">
              {lang==='ja'?'これが成立すると':'What this unlocks'}
            </div>
            {t.unlocks.map(u=>{
              const o = TILES.find(x=>x.id===u); if(!o) return null;
              return (
                <button key={u} onClick={()=>onJump(u)}
                  className="block text-left text-[12px] text-emerald-800 hover:underline">
                  → {L(o)}
                </button>
              );
            })}
          </div>
        )}

        {/* the ask */}
        <div className="pt-1 space-y-2">
          {t.state==='lapsed' ? (
            <div className="text-[12px] text-stone-500 bg-stone-50 rounded-xl px-3 py-2.5">
              {lang==='ja'
                ? '期限までに人数が集まりませんでした。預り金は返金済みです。再提案できます。'
                : 'Did not reach its threshold by the deadline. Deposits returned. Open to re-proposal.'}
            </div>
          ) : (
            <>
              <button className="w-full py-2.5 rounded-xl text-white text-sm font-medium"
                      style={{background:s.ring}}>
                {t.state==='open'
                  ? (lang==='ja'?'空きを確保する':'Take a place')
                  : (lang==='ja'?'参加を確定する':'Commit')}
              </button>
              <button className="w-full py-2.5 rounded-xl border border-amber-200 text-amber-800 text-sm">
                {lang==='ja'?'まずは関心を伝える':'Just register interest'}
              </button>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

/* ── legend / empty state ── */
function Legend({lang,L}){
  const counts = {};
  TILES.forEach(t=>counts[t.state]=(counts[t.state]||0)+1);
  return (
    <div className="rounded-2xl border border-amber-100 bg-white p-5">
      <h3 className="font-display text-lg text-warm mb-1">
        {lang==='ja'?'タイルを選んでください':'Pick a tile'}
      </h3>
      <p className="text-sm text-stone-500 leading-relaxed mb-4">
        {lang==='ja'
          ? '一つひとつが「まだ無いけれど、人が集まれば起こること」です。クリックすると、あと何人必要かが分かります。'
          : 'Each one is something that does not exist yet, and will if enough people say yes. Click to see how many that is.'}
      </p>
      <div className="space-y-2">
        {Object.entries(STATE_STYLE).filter(([k])=>counts[k]).map(([k,s])=>(
          <div key={k} className="flex items-center gap-2.5 text-sm">
            <span className="w-3.5 h-3.5 rounded-full shrink-0" style={{background:s.fill,border:`2px solid ${s.ring}`}}/>
            <span className="text-stone-600">{lang==='ja'?s.ja:s.label}</span>
            <span className="ml-auto text-stone-400 text-xs">{counts[k]}</span>
          </div>
        ))}
      </div>
      <div className="mt-5 pt-4 border-t border-amber-100">
        <p className="text-[11px] text-stone-500 leading-relaxed">
          {lang==='ja'
            ? '「すでにある」レイヤーは、いま現にこの町にあるもの — お店、学校、病院、神社。タイルは決してその上には置きません。'
            : 'The “already here” layer is what this town actually has right now — shops, schools, the hospital, the shrines. No tile is ever placed over any of it.'}
        </p>
      </div>
    </div>
  );
}

/* svg arc helper for the progress ring */
function polar(cx,cy,r,deg){ const a=(deg-90)*Math.PI/180; return {x:cx+r*Math.cos(a), y:cy+r*Math.sin(a)}; }
function describeArc(cx,cy,r,start,end){
  if (end<=0) return '';
  if (end>=360) end = 359.9;
  const s=polar(cx,cy,r,end), e=polar(cx,cy,r,start);
  const large = end-start<=180?'0':'1';
  return `M ${s.x} ${s.y} A ${r} ${r} 0 ${large} 0 ${e.x} ${e.y}`;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
